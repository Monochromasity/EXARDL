<!DOCTYPE html>
<head>
  <style>
    body {
      background-color: #292929;
      color: white;
      font-family: "Raleway", sans-serif;
      padding: 0px 40px 10px 40px;
    }
    a.hlink {
      text-decoration: none;
      font-size: 30px;
      padding: 10px;
      border-radius: 5px;
      color: white;
      transition-duration: 0.4s;
      margin-bottom: 10px;
    }
    a.hlink:hover {
      background-color: #333333;
      font-size: 36px;
      
    }
    .header {
      border-bottom: 2px solid #424242;
      padding: 10px 0px;
      display: flex;
      align-items: center;
    }
    .logo {
      font-size: 40px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .main {
      display: flex;
      margin-top: 20px;
    }
    .list {
      flex: 25%;
    }
    .level {
      flex: 75%;
    }
  </style>
</head>
<html>
  <body>
    <div class="header">
      <b class="logo">EXARDL</b>
      <a href="/" class="hlink">List</a>
      <a href="/leaderboard" class="hlink">Leaderboard</a>
    </div>
    <div class="main">
      <div class="list">List</div>
      <div class="level">Level</div>
    </div>
  </body>
</html>
